# Android shell: the OpenIDEA UI in a WebView, with none of the desktop backend crates.
# Its own workspace, so `cargo clippy --workspace` and the desktop build never touch it.
[package]
name = "openidea-android"
description = "OpenIDEA Android shell"
version = "0.1.34"
edition = "2024"
license = "Apache-2.0"

[lib]
name = "openidea_android_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[workspace]
